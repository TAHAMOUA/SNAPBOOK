services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snapbook-app
    ports:
      - "8000:80"
    # Bind-mounted storage is created outside the image, so re-apply
    # web-writable permissions on every start (apache runs as www-data).
    command: >
      sh -c "chmod -R 0777 storage bootstrap/cache
      && exec docker-php-entrypoint apache2-foreground"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  node:
    image: node:22
    container_name: snapbook-node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: snapbook-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: snapbook
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: snapbook
    volumes:
      - snapbook_mysql_data:/var/lib/mysql

volumes:
  snapbook_mysql_data: