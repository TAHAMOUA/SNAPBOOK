; SNAPBOOK performance fix
; The project folder is bind-mounted from Windows into /var/www/html.
; Every request makes opcache re-stat() hundreds of PHP files across that
; slow bind mount (~4-5ms per file), which caused multi-second page loads.
; Disabling timestamp validation makes opcache serve compiled scripts from
; shared memory without any per-request disk stat.
;
; NOTE: after changing PHP or Blade files, restart the app so opcache picks
; up the new code:
;   docker compose restart app
opcache.validate_timestamps=0