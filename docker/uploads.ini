; SNAPBOOK upload limits
;
; upload_max_filesize is PHP's hard per-file limit. It is aligned with the
; Laravel PortfolioRequest max:5120 rule (5 MB). Files larger than this are
; rejected by PHP with a per-file error (UPLOAD_ERR_INI_SIZE) that Laravel
; still receives and turns into a clean validation message.
;
; post_max_size is the limit for the whole request body. When it is exceeded,
; PHP discards the ENTIRE request BEFORE Laravel runs and emits a raw
; "POST Content-Length ... exceeds the limit ..." warning that cannot be
; caught by application code. It must therefore be high enough that a
; realistically oversized image upload is still ingested by PHP, so Laravel's
; validation can report a friendly "image too large" error instead.
upload_max_filesize=5M
post_max_size=64M